<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="QuickFix - Premium Electronics & Smartphone Repair Service App">
  <meta name="theme-color" content="#003A26">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="QuickFix Device Care">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>QuickFix — Doorstep Device Care & Diagnostics</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #080C0A;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #F4F6F5;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(237, 176, 0, 0.2);
      border-top-color: #EDB000;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .brand-title {
      margin-top: 18px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .brand-title span {
      color: #EDB000;
    }
    .brand-tag {
      font-size: 13px;
      color: #8C9993;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-container">
    <div class="spinner"></div>
    <div class="brand-title">Quick<span>Fix</span></div>
    <div class="brand-tag">Premium Doorstep Device Care</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
