name: QuickFix Commercial CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  flutter-verify:
    name: Flutter Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Code Quality
        run: flutter analyze --no-fatal-infos

      - name: Run Automated Test Suite
        run: flutter test

      - name: Build Android App Bundle (.aab)
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Upload Release Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickfix-release-aab
          path: build/app/outputs/bundle/release/*.aab
